<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SerGene | Deal Intelligence Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; overflow: hidden; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        #root { height: 100vh; width: 100vw; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader { 
            width: 48px; height: 48px; 
            border: 4px solid #3b82f6; 
            border-top-color: transparent; 
            border-radius: 50%; 
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; 
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- Initial Loading State (Replaced by React) -->
        <div style="height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; background: #0f172a; color: white; flex-direction: column;">
            <div class="loader"></div>
            <p style="margin-top: 24px; font-weight: bold; letter-spacing: 0.2em; font-size: 10px; opacity: 0.5;">INITIALIZING SERGENE INTEL...</p>
        </div>
    </div>

    <!-- Core React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    
    <!-- Lucide Icons UMD -->
    <script src="https://unpkg.com/lucide@0.321.0/dist/umd/lucide.min.js"></script>
    
    <!-- Hyparquet UMD -->
    <script src="https://unpkg.com/hyparquet@0.4.0/dist/hyparquet.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        /**
         * Reusable Icon Component 
         * Safely renders Lucide icons from the global UMD library
         */
        const Icon = ({ name, size = 18, className = "" }) => {
            const [svgContent, setSvgContent] = useState(null);

            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    const iconData = window.lucide.icons[name];
                    const [tag, attrs, children] = iconData;
                    
                    const renderChildren = (childList) => {
                        return childList.map(([cTag, cAttrs], i) => (
                            React.createElement(cTag, { key: i, ...cAttrs })
                        ));
                    };

                    const element = React.createElement(
                        'svg',
                        {
                            xmlns: "http://www.w3.org/2000/svg",
                            width: size,
                            height: size,
                            viewBox: "0 0 24 24",
                            fill: "none",
                            stroke: "currentColor",
                            strokeWidth: 2,
                            strokeLinecap: "round",
                            strokeLinejoin: "round",
                            className: className
                        },
                        renderChildren(children)
                    );
                    setSvgContent(element);
                }
            }, [name, size, className]);

            return svgContent || <div style={{ width: size, height: size }} className="bg-slate-200/20 rounded-sm animate-pulse" />;
        };

        const RAW_DATA_URL = "https://raw.githubusercontent.com/spirosservos/sergene-portal/main/sg_intel_assets.parquet";
        const PORTAL_PASSWORD = "SerGene2024"; 
        const CATEGORIES_LIST = ['Financing/VC', 'Financial/M&A', 'Partnership/R&D', 'Clinical/Regulatory'];
        const MODALITIES_LIST = ["Small Molecule", "Biologics", "Protein Degrader", "Peptide", "GLP-1", "Incretin", "RNA", "mRNA", "siRNA", "RNAi", "miRNA", "ASO", "Antisense", "Aptamer", "CRISPR", "Gene Therapy", "Gene Editing", "Base Editing", "Prime Editing", "AAV", "Lentivirus", "Lenti Vector", "Tregs", "TCR", "CAR-T", "Cell Therapy", "NK Cells", "TILs", "ADC", "Antibody", "Bispecific", "Exosomes", "LNP", "Oral"];

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [authError, setAuthError] = useState(false);
            const [viewMode, setViewMode] = useState('interactive');
            const [allDeals, setAllDeals] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(null);
            
            // Filters
            const [searchTerm, setSearchTerm] = useState('');
            const [isModalityModalOpen, setIsModalityModalOpen] = useState(false);
            const [dateRange, setDateRange] = useState({ start: '', end: '' });
            const [selectedCategories, setSelectedCategories] = useState([]);
            const [selectedModalities, setSelectedModalities] = useState([]);

            useEffect(() => {
                const loadData = async () => {
                    try {
                        setIsLoading(true);
                        
                        // Check for engine
                        if (!window.hyparquet) {
                            throw new Error("Parquet engine (hyparquet) could not be loaded from CDN.");
                        }

                        const resp = await fetch(RAW_DATA_URL);
                        if (!resp.ok) throw new Error(`Could not reach database file (HTTP ${resp.status})`);
                        
                        const buffer = await resp.arrayBuffer();
                        
                        // Use hyparquet helper to read data
                        // This handles both metadata and row mapping
                        window.hyparquet.parquetRead({
                            file: buffer,
                            onComplete: (rows) => {
                                try {
                                    // Map based on the column headers provided by the parquet metadata
                                    // This is safer than hardcoding indices like row[0]
                                    const formatted = rows.map((row, idx) => {
                                        // Using positions based on your current pyarrow export
                                        return {
                                            ID: row[0] || `r-${idx}`,
                                            Date: row[1] || '',
                                            Title: row[2] || 'Untitled',
                                            Category: row[3] || 'General',
                                            PartnerA: row[14] || '', 
                                            PartnerB: row[15] || '',
                                            DealValue: row[10] || 'Undisclosed',
                                            StrategicInsight: row[5] || '', 
                                            TherapeuticArea: row[6] || '',
                                            Score: parseInt(row[7]) || 0,
                                            Summary: row[9] || '',
                                            Modalities: Array.isArray(row[row.length - 1]) ? row[row.length - 1] : []
                                        };
                                    });
                                    setAllDeals(formatted);
                                    setIsLoading(false);
                                } catch (e) {
                                    console.error(e);
                                    setLoadError("Failed to parse data structure. Check console for details.");
                                    setIsLoading(false);
                                }
                            }
                        });
                    } catch (err) {
                        setLoadError(err.message);
                        setIsLoading(false);
                    }
                };
                loadData();
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === PORTAL_PASSWORD) {
                    setIsLoggedIn(true);
                    setAuthError(false);
                } else {
                    setAuthError(true);
                }
            };

            const toggleFilter = (item, list, setList) => {
                if (list.includes(item)) setList(list.filter(i => i !== item));
                else setList([...list, item]);
            };

            const filteredDeals = useMemo(() => {
                const data = allDeals.filter(deal => {
                    const content = `${deal.Title} ${deal.StrategicInsight} ${deal.PartnerA} ${deal.PartnerB} ${deal.TherapeuticArea}`.toLowerCase();
                    const matchesSearch = content.includes(searchTerm.toLowerCase());
                    const matchesCategory = selectedCategories.length === 0 || selectedCategories.includes(deal.Category);
                    const matchesModality = selectedModalities.length === 0 || 
                        (deal.Modalities && deal.Modalities.some(m => selectedModalities.includes(m)));
                    
                    const dDate = deal.Date ? new Date(deal.Date) : null;
                    const matchesDate = (!dateRange.start || (dDate && dDate >= new Date(dateRange.start))) &&
                                        (!dateRange.end || (dDate && dDate <= new Date(dateRange.end)));
                    
                    return matchesSearch && matchesCategory && matchesModality && matchesDate;
                });
                return isLoggedIn ? data : data.slice(0, 5); // Severe limit for guest
            }, [searchTerm, selectedCategories, selectedModalities, dateRange, isLoggedIn, allDeals]);

            if (isLoading) {
                return (
                    <div className="h-screen w-full flex flex-col items-center justify-center bg-slate-950 text-white">
                        <div className="loader"></div>
                        <p className="mt-6 text-[10px] font-black opacity-40 uppercase tracking-[0.3em]">Connecting to SerGene Cloud</p>
                    </div>
                );
            }

            if (loadError) {
                return (
                    <div className="h-screen w-full flex flex-col items-center justify-center bg-slate-50 p-8 text-center">
                        <div className="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-6">
                            <Icon name="AlertCircle" size={32} />
                        </div>
                        <h2 className="text-xl font-bold text-slate-900">System Connection Failed</h2>
                        <p className="text-slate-500 mt-2 max-w-sm text-sm">{loadError}</p>
                        <button onClick={() => window.location.reload()} className="mt-8 bg-slate-900 text-white px-8 py-3 rounded-xl font-bold text-sm hover:bg-slate-800 transition-colors shadow-lg">
                            Retry Connection
                        </button>
                    </div>
                );
            }

            return (
                <div className="flex h-screen bg-slate-50 text-slate-900 overflow-hidden">
                    {/* Sidebar */}
                    <aside className="w-72 bg-slate-950 text-slate-300 flex flex-col shrink-0 border-r border-white/5">
                        <div className="p-6 border-b border-white/5 flex items-center gap-3">
                            <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black shadow-lg shadow-blue-500/20">SG</div>
                            <div>
                                <h1 className="font-black text-white leading-none tracking-tight">SerGene</h1>
                                <p className="text-[9px] uppercase tracking-widest text-blue-400 mt-1 font-bold">Deal Intelligence</p>
                            </div>
                        </div>

                        <nav className="flex-1 overflow-y-auto p-6 space-y-8 scrollbar-hide">
                            <div className={`space-y-4 ${!isLoggedIn ? 'opacity-30 cursor-not-allowed select-none' : ''}`}>
                                <h3 className="text-[10px] font-black uppercase text-slate-500 flex items-center gap-2">
                                    <Icon name="FlaskConical" size={14} className="text-blue-500" /> Modalities
                                </h3>
                                <button 
                                    disabled={!isLoggedIn}
                                    onClick={() => setIsModalityModalOpen(true)} 
                                    className="w-full flex items-center justify-between bg-white/5 border border-white/10 rounded-xl p-3.5 text-xs text-slate-300 hover:bg-white/10 transition-colors"
                                >
                                    <span className="font-semibold">{selectedModalities.length > 0 ? `${selectedModalities.length} Selected` : 'Select Modalities'}</span>
                                    <Icon name="ChevronRight" size={14} className="text-slate-500" />
                                </button>
                            </div>

                            <div className={`space-y-4 ${!isLoggedIn ? 'opacity-30 cursor-not-allowed select-none' : ''}`}>
                                <h3 className="text-[10px] font-black uppercase text-slate-500 flex items-center gap-2">
                                    <Icon name="Calendar" size={14} className="text-blue-500" /> Time Horizon
                                </h3>
                                <div className="grid grid-cols-1 gap-2">
                                    <input type="date" disabled={!isLoggedIn} className="w-full bg-white/5 border border-white/10 rounded-lg p-2.5 text-xs text-white outline-none focus:border-blue-500" value={dateRange.start} onChange={e => setDateRange({...dateRange, start: e.target.value})} />
                                    <input type="date" disabled={!isLoggedIn} className="w-full bg-white/5 border border-white/10 rounded-lg p-2.5 text-xs text-white outline-none focus:border-blue-500" value={dateRange.end} onChange={e => setDateRange({...dateRange, end: e.target.value})} />
                                </div>
                            </div>

                            <div className="space-y-4">
                                <h3 className="text-[10px] font-black uppercase text-slate-500 flex items-center gap-2">
                                    <Icon name="Filter" size={14} className="text-blue-500" /> Category
                                </h3>
                                <div className="space-y-1">
                                    {CATEGORIES_LIST.map(cat => (
                                        <button 
                                            key={cat} 
                                            onClick={() => toggleFilter(cat, selectedCategories, setSelectedCategories)} 
                                            className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${selectedCategories.includes(cat) ? 'bg-blue-600/20 text-blue-400 border border-blue-500/20' : 'text-slate-400 hover:bg-white/5'}`}
                                        >
                                            <Icon name={selectedCategories.includes(cat) ? "CheckCircle2" : "Circle"} size={14} /> {cat}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </nav>

                        <div className="p-6 border-t border-white/5">
                            <div className={`p-5 rounded-2xl border transition-all ${isLoggedIn ? 'bg-emerald-500/5 border-emerald-500/20' : 'bg-white/5 border-white/10'}`}>
                                <div className="flex items-center gap-3 mb-4">
                                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${isLoggedIn ? 'bg-emerald-500/20 text-emerald-400' : 'bg-blue-500/20 text-blue-400'}`}>
                                        <Icon name={isLoggedIn ? "ShieldCheck" : "Lock"} size={18} />
                                    </div>
                                    <div><p className="text-[11px] font-black text-white uppercase tracking-wider">{isLoggedIn ? 'Verified Access' : 'Guest Mode'}</p></div>
                                </div>
                                {!isLoggedIn && (
                                    <form onSubmit={handleLogin} className="space-y-2">
                                        <input type="password" placeholder="Passkey" className={`w-full bg-slate-900 border ${authError ? 'border-red-500/50' : 'border-white/10'} rounded-lg p-2.5 text-[10px] text-white outline-none focus:border-blue-500 transition-colors`} value={passwordInput} onChange={e => setPasswordInput(e.target.value)} />
                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all">Unlock Portal</button>
                                    </form>
                                )}
                                {isLoggedIn && (
                                    <p className="text-[10px] text-slate-500 font-medium leading-relaxed">Full database access active. Proprietary SerGene intelligence unlocked.</p>
                                )}
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col overflow-hidden relative">
                        {/* Modality Modal */}
                        {isModalityModalOpen && (
                            <div className="absolute inset-0 z-[60] flex items-center justify-center p-8 bg-slate-950/60 backdrop-blur-md">
                                <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden border">
                                    <div className="p-8 border-b flex items-center justify-between bg-slate-50/50">
                                        <div>
                                            <h3 className="text-xl font-black text-slate-900">Select Modalities</h3>
                                            <p className="text-sm text-slate-500">Filter deal intelligence by specific biotech sectors.</p>
                                        </div>
                                        <button onClick={() => setIsModalityModalOpen(false)} className="p-2.5 hover:bg-white rounded-full border shadow-sm transition-all"><Icon name="X" size={20} /></button>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-8 grid grid-cols-2 md:grid-cols-4 gap-3">
                                        {MODALITIES_LIST.map(mod => (
                                            <button 
                                                key={mod} 
                                                onClick={() => toggleFilter(mod, selectedModalities, setSelectedModalities)} 
                                                className={`p-4 rounded-2xl border text-[11px] font-black transition-all text-center ${selectedModalities.includes(mod) ? 'bg-blue-600 border-blue-600 text-white shadow-lg shadow-blue-500/20' : 'bg-white border-slate-100 text-slate-600 hover:border-blue-400'}`}
                                            >
                                                {mod}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="p-8 border-t flex justify-between items-center bg-slate-50/50">
                                        <button onClick={() => setSelectedModalities([])} className="text-xs font-bold text-slate-500 hover:text-red-500">Clear All</button>
                                        <button onClick={() => setIsModalityModalOpen(false)} className="bg-slate-900 text-white px-12 py-4 rounded-2xl font-black text-sm hover:scale-105 transition-transform">Apply Filter</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <header className="h-24 bg-white border-b flex items-center justify-between px-10 shrink-0">
                            <div className="flex items-center gap-8">
                                <h2 className="text-xl font-black uppercase tracking-tight text-slate-900">Intelligence Portal</h2>
                                <div className="flex bg-slate-100 p-1.5 rounded-xl">
                                    <button onClick={() => setViewMode('interactive')} className={`px-6 py-2 rounded-lg text-xs font-black transition-all ${viewMode === 'interactive' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400'}`}>Interactive Table</button>
                                    <button onClick={() => setViewMode('reading')} className={`px-6 py-2 rounded-lg text-xs font-black transition-all ${viewMode === 'reading' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400'}`}>Deep Read</button>
                                </div>
                            </div>
                            <div className="relative group">
                                <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors"><Icon name="Search" size={18} /></div>
                                <input 
                                    type="text" 
                                    placeholder="Search by asset, partner, or insight..." 
                                    className="pl-12 pr-6 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm w-[400px] outline-none focus:ring-4 focus:ring-blue-500/5 focus:border-blue-500 transition-all" 
                                    value={searchTerm} 
                                    onChange={e => setSearchTerm(e.target.value)} 
                                />
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-10 scroll-smooth bg-slate-50/30">
                            {!isLoggedIn && (
                                <div className="mb-8 p-4 bg-amber-50 border border-amber-200 rounded-2xl flex items-center gap-4 text-amber-800 shadow-sm">
                                    <div className="bg-amber-100 p-2 rounded-lg"><Icon name="AlertTriangle" size={20} /></div>
                                    <div>
                                        <p className="text-sm font-bold leading-none">Guest Access Preview</p>
                                        <p className="text-[11px] opacity-80 mt-1">You are seeing a limited subset of data. Enter passkey for full deal history and therapeutic deep-dives.</p>
                                    </div>
                                </div>
                            )}

                            {filteredDeals.length > 0 ? (
                                viewMode === 'interactive' ? (
                                    <div className="bg-white rounded-[2rem] border shadow-sm overflow-hidden mb-12">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-slate-50/80 border-b text-[10px] font-black text-slate-400 uppercase tracking-[0.15em]">
                                                    <th className="p-6 w-32">Date</th>
                                                    <th className="p-6">Strategic Opportunity & Insight</th>
                                                    <th className="p-6 w-48">Lead Org</th>
                                                    <th className="p-6 w-48">Partner</th>
                                                    <th className="p-6 w-36">Value</th>
                                                    <th className="p-6 text-center w-28">Score</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {filteredDeals.map((deal) => (
                                                    <tr key={deal.ID} className="group hover:bg-blue-50/30 transition-all">
                                                        <td className="p-6 text-sm font-bold text-slate-400 align-top">{deal.Date}</td>
                                                        <td className="p-6 max-w-lg align-top">
                                                            <p className="font-bold text-slate-900 leading-snug mb-1 group-hover:text-blue-600 transition-colors">{deal.StrategicInsight}</p>
                                                            <p className="text-[11px] text-slate-500 font-medium mb-4">{deal.Title}</p>
                                                            <div className="flex flex-wrap gap-1.5">
                                                                <span className="text-[9px] bg-blue-100 text-blue-700 px-2.5 py-1 rounded-lg font-black border border-blue-200 uppercase tracking-wider">{deal.TherapeuticArea}</span>
                                                                {deal.Modalities && deal.Modalities.map(m => (
                                                                    <span key={m} className="text-[9px] bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg font-bold uppercase">{m}</span>
                                                                ))}
                                                            </div>
                                                        </td>
                                                        <td className="p-6 align-top font-bold text-slate-700 text-xs">{deal.PartnerA}</td>
                                                        <td className="p-6 align-top font-bold text-slate-700 text-xs">{deal.PartnerB}</td>
                                                        <td className="p-6 font-black text-emerald-600 text-sm align-top">{deal.DealValue}</td>
                                                        <td className="p-6 text-center align-top">
                                                            <div className={`inline-flex items-center justify-center w-12 h-12 rounded-2xl font-black text-sm shadow-sm ${deal.Score > 15 ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-500'}`}>
                                                                {deal.Score}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                ) : (
                                    <div className="space-y-10 pb-20">
                                        {filteredDeals.map((deal) => (
                                            <div key={deal.ID} className="bg-white p-12 rounded-[3rem] border shadow-sm flex gap-12 hover:shadow-xl transition-all duration-500 group">
                                                <div className="flex-1">
                                                    <div className="flex gap-6 mb-8 items-center text-xs font-black">
                                                        <span className="text-blue-600 bg-blue-50 px-4 py-1.5 rounded-full uppercase tracking-widest border border-blue-100">{deal.Category}</span>
                                                        <span className="text-slate-400">{deal.Date}</span>
                                                    </div>
                                                    <h3 className="text-3xl font-black mb-8 leading-tight text-slate-900 group-hover:text-blue-600 transition-colors">{deal.Title}</h3>
                                                    <div className="bg-slate-950 p-8 rounded-[2rem] mb-8 shadow-2xl relative overflow-hidden">
                                                        <div className="absolute top-0 right-0 p-8 opacity-10 text-white"><Icon name="Quote" size={64} /></div>
                                                        <p className="text-[10px] font-black text-blue-400 uppercase mb-3 tracking-[0.2em]">Strategic Intelligence</p>
                                                        <p className="text-xl text-white font-medium italic leading-relaxed">"{deal.StrategicInsight}"</p>
                                                    </div>
                                                    <p className="text-slate-500 text-lg leading-relaxed mb-10 font-medium">{deal.Summary}</p>
                                                    <div className="flex gap-12 pt-10 border-t border-slate-100">
                                                        <div className="flex flex-col gap-1.5"><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Lead Org</p><p className="font-black text-slate-800">{deal.PartnerA}</p></div>
                                                        <div className="flex flex-col gap-1.5"><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Partner</p><p className="font-black text-slate-800">{deal.PartnerB}</p></div>
                                                        <div className="flex flex-col gap-1.5"><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Est. Value</p><p className="font-black text-emerald-600">{deal.DealValue}</p></div>
                                                    </div>
                                                </div>
                                                <div className="w-56 border-l border-slate-100 pl-12 flex flex-col justify-center items-center text-center shrink-0">
                                                    <div className="relative mb-6">
                                                        <svg className="w-32 h-32 transform -rotate-90">
                                                            <circle cx="64" cy="64" r="58" stroke="currentColor" strokeWidth="8" fill="transparent" className="text-slate-100" />
                                                            <circle cx="64" cy="64" r="58" stroke="currentColor" strokeWidth="8" fill="transparent" strokeDasharray={364.4} strokeDashoffset={364.4 - (364.4 * deal.Score / 25)} className={deal.Score > 15 ? 'text-emerald-500' : 'text-blue-500'} strokeLinecap="round" />
                                                        </svg>
                                                        <div className="absolute inset-0 flex items-center justify-center">
                                                            <span className="text-4xl font-black text-slate-900">{deal.Score}</span>
                                                        </div>
                                                    </div>
                                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">SerGene Score</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )
                            ) : (
                                <div className="py-48 flex flex-col items-center justify-center text-center">
                                    <div className="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center text-slate-300 mb-6">
                                        <Icon name="SearchX" size={40} />
                                    </div>
                                    <p className="text-xl font-bold text-slate-400">No matches found for your current filters.</p>
                                    <button onClick={() => {setSearchTerm(''); setSelectedCategories([]); setSelectedModalities([]);}} className="mt-4 text-blue-600 font-bold text-sm hover:underline">Reset all filters</button>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
